[package]
name = "chromink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chromink-core = { path = "../crates/chromink-core", features = ["gpu", "preview"] }
serde_json = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png"] }
hayro-interpret = {path="../vendor/hayro-interpret",default-features=false}
tiff = "0.9.1"

dirs = "7"

clap = { version = "4", features = ["derive"] }
glob = "0.3"

[[bin]]
name = "Chromink"
path = "src/main.rs"
